name: Generate AI briefs
on:
  schedule:
    - cron: '0 23 * * *'    # 07:00 Hong Kong
    - cron: '35 13 * * 1-5' # US market open
    - cron: '10 20 * * 1-5' # US market close
  workflow_dispatch: {}
concurrency:
  group: data-update
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate briefs
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUN_AI: "1"
        run: python3 fetch_data.py
      - name: Commit
        run: |
          git config user.name "flow-data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: AI briefs + snapshot"
          git pull --rebase origin main || true
          git push
